name: Build profile assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - tests/**
      - assets/**
      - .github/workflows/build-profile.yml

permissions:
  contents: read

concurrency:
  group: profile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional portrait dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Check public data fetching
        run: python -m unittest discover -s tests -v
      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate.py --sync
      - name: Validate generated assets
        run: python scripts/validate.py
      - uses: actions/upload-artifact@v7
        with:
          name: profile-assets
          path: |
            README.md
            *.svg
            data/github.json
            data/contributions.json
            assets/fonts/OFL.txt
          if-no-files-found: error
